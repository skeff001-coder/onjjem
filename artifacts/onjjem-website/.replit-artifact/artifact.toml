kind = "web"
previewPath = "/"
title = "ONJJEM Shop"
version = "1.0.0"
id = "artifacts/onjjem-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24039

[services.development]
run = "pnpm --filter @workspace/onjjem-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onjjem-website", "run", "build" ]
publicDir = "artifacts/onjjem-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24039"
BASE_PATH = "/"
