kind = "web"
previewPath = "/whatsupdog/"
title = "What's Up Dog"
version = "1.0.0"
id = "artifacts/whatsupdog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/whatsupdog/" ]
localPort = 20664

[services.development]
run = "pnpm --filter @workspace/whatsupdog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whatsupdog", "run", "build" ]
publicDir = "artifacts/whatsupdog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20664"
BASE_PATH = "/whatsupdog/"
