workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onjjem.canineencyclopedia
      node: 22.12.0
      vars:
        BUNDLE_ID: com.onjjem.canineencyclopedia
        XCODE_WORKSPACE: ios/CanineEncyclopedia.xcworkspace
        XCODE_SCHEME: CanineEncyclopedia
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm
      - name: Install dependencies
        script: |
          cd artifacts/canine-encyclopedia
          pnpm install --no-frozen-lockfile
      - name: Set up Expo credentials
        script: |
          cd artifacts/canine-encyclopedia
          npx expo install --fix
      - name: Prebuild iOS
        script: |
          cd artifacts/canine-encyclopedia
          npx expo prebuild --platform ios --clean
      - name: Patch Podfile for Xcode 26 fmt compile bug
        script: |
          cd artifacts/canine-encyclopedia
          python3 scripts/patch-podfile.py
      - name: Install CocoaPods
        script: |
          cd artifacts/canine-encyclopedia/ios
          pod install
      - name: Build iOS
        script: |
          cd artifacts/canine-encyclopedia
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/CanineEncyclopedia.xcworkspace \
            --scheme CanineEncyclopedia
    artifacts:
      - artifacts/canine-encyclopedia/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
