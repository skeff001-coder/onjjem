workflows:
  onjjem-ios-release:
    name: ONJJEM Photo Gifts — iOS App Store
    instance_type: mac_mini_m1
    max_build_duration: 90
    working_directory: artifacts/owens-photofix
    environment:
      node: v20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onjjem.photorestoration
      vars:
        BUNDLE_ID: com.onjjem.photorestoration
        ASC_APP_ID: "6770767370"
        APP_VERSION: "2.0.0"
        EXPO_PUBLIC_DOMAIN: "onjjem-production-5ef8.up.railway.app"
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm --force || true
      - name: Install workspace dependencies
        script: cd ../.. && pnpm install --no-frozen-lockfile
      - name: Install local dependencies
        script: pnpm install --ignore-workspace --no-frozen-lockfile
      - name: Fetch latest build number from App Store Connect
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$ASC_APP_ID" --all-versions)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest known build number: $LATEST_BUILD_NUMBER — using: $NEXT_BUILD_NUMBER"
          echo "BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV
      - name: Set app version and build number
        script: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json','utf8'));
            app.expo.version = process.env.APP_VERSION;
            if (!app.expo.ios) app.expo.ios = {};
            app.expo.ios.buildNumber = process.env.BUILD_NUMBER;
            app.expo.ios.bundleIdentifier = 'com.onjjem.photorestoration';
            app.expo.newArchEnabled = false;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('Version set to', app.expo.version, 'build', app.expo.ios.buildNumber);
          "
      - name: Test Metro bundle
        script: |
          npx expo export --platform ios --output-dir /tmp/metro-test 2>&1 | tail -20
      - name: Build iOS IPA
        script: |
          xcode-project use-profiles
          cd ios && xcodebuild -workspace ONJJEMPhotoGifts.xcworkspace \
            -scheme ONJJEMPhotoGifts \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/ONJJEMPhotoGifts.xcarchive \
            archive | xcpretty
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/ONJJEMPhotoGifts.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $CM_BUILD_DIR/output | xcpretty
    artifacts:
      - $CM_BUILD_DIR/output/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: 9ZUDVUV524
        issuer_id: 48a98d11-f9f9-4c66-ac96-a4834a146201
        submit_to_testflight: true
