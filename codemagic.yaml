# ============================================================
# ONJJEM iOS App (owens-photofix) — App Store Release
# ============================================================
workflows:
  owens-photofix-ios-release:
    name: ONJJEM (owens-photofix) - iOS App Store Release
    instance_type: mac_mini_m1
    max_build_duration: 60

    integrations:
      app_store_connect: "ONJJEM Codemagic"

    environment:
      node: v20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onjjem.photorestoration
      vars:
        BUNDLE_ID: com.onjjem.photorestoration
        EXPO_PUBLIC_DOMAIN: onjjem-production-5ef8.up.railway.app


    scripts:
      # --- Setup ---
      - name: Install pnpm
        script: npm install -g pnpm --force

      - name: Install workspace dependencies
        script: pnpm install --no-frozen-lockfile

      - name: Install owens-photofix dependencies
        script: |
          cd artifacts/owens-photofix
          pnpm install --no-frozen-lockfile --ignore-workspace

      # --- Build native project ---
      - name: Expo prebuild (generate native iOS project)
        script: |
          cd artifacts/owens-photofix
          pnpm exec expo prebuild --platform ios --clean

      # --- Signing ---
      - name: Set up signing
        script: |
          cd artifacts/owens-photofix
          xcode-project use-profiles

      # --- Archive & IPA ---
      - name: Build iOS IPA
        script: |
          WORKSPACE=$(find artifacts/owens-photofix/ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME="ONJJEMPhotoRestoration"
          echo "Workspace: $WORKSPACE   Scheme: $SCHEME"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"

    artifacts:
      - "**/*.ipa"
      - "**/*.dSYM.zip"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false


# ============================================================
# What's Up Dog! (canine-encyclopedia) — iOS Release
# ============================================================
  canine-encyclopedia-ios-release:
    name: What's Up Dog! - iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "ONJJEM Codemagic"

    environment:
      xcode: 26.1
      node: 22.12.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.onjjem.canineencyclopedia
      vars:
        BUNDLE_ID: com.onjjem.canineencyclopedia
        EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: appl_QlAKzSnABwsXylEXGysyHrvnJpx
        EXPO_PUBLIC_REVENUECAT_TEST_API_KEY: appl_QlAKzSnABwsXylEXGysyHrvnJpx
        EXPO_PUBLIC_DOMAIN: onjjem-production-5ef8.up.railway.app

    scripts:
      # --- Setup ---
      - name: Install pnpm
        script: npm install -g pnpm --force

      - name: Install dependencies
        script: |
          cd artifacts/canine-encyclopedia
          pnpm install --no-frozen-lockfile

      - name: Set up Expo credentials
        script: |
          cd artifacts/canine-encyclopedia
          npx expo install --fix

      # --- Build native project ---
      - name: Prebuild iOS
        script: |
          cd artifacts/canine-encyclopedia
          EXPO_NO_UPDATES_CHECK=1 EX_UPDATES_NATIVE_DEBUG=0 CI=1 npx expo prebuild --platform ios --clean --no-install

      - name: Install dependencies after prebuild
        script: |
          cd artifacts/canine-encyclopedia
          pnpm install --no-frozen-lockfile

      - name: Patch Podfile for Xcode 26 fmt compile bug
        script: |
          cd artifacts/canine-encyclopedia
          python3 scripts/patch-podfile.py
          # Also remove expo-updates pod script phase that fails on Xcode 26
          cd ios
          sed -i '' '/Generate updates resources for expo-updates/,/shellScript/s/shellScript = ".*/shellScript = "exit 0\\\\n"/' Pods/Pods.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Install CocoaPods
        script: |
          cd artifacts/canine-encyclopedia/ios
          pod install

      # --- Signing, Archive & IPA ---
      - name: Build iOS
        script: |
          cd artifacts/canine-encyclopedia
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME="ThatsMyDog"
          echo "Workspace: $WORKSPACE   Scheme: $SCHEME"
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --disable-xcpretty

    artifacts:
      - artifacts/canine-encyclopedia/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
